# Ablation: watermark strength (delta) vs detectability, text quality and robustness.
name: delta_ablation
description: KGW with delta in {1, 2, 4} (gamma=0.25) on the same prompts; quality/robustness trade-off.
experiment_type: watermark_robustness
seed: 42
dataset:
  source: c4_realnewslike
  n_samples: 150
  prompt_words: 50
  continuation_words: 150
generator:
  model_name: Qwen/Qwen2.5-0.5B
  max_new_tokens: 200
  min_new_tokens: 150
  temperature: 0.8
  top_p: 0.95
  batch_size: 8
watermarks:
  - {method: kgw, label: kgw_delta1, config: {delta: 1.0}}
  - {method: kgw, label: kgw_delta2, config: {delta: 2.0}}
  - {method: kgw, label: kgw_delta4, config: {delta: 4.0}}
attacks:
  - {name: word_deletion, label: delete_30pct, config: {rate: 0.3}}
  - {name: lexical_substitution, label: lexical_20pct, config: {rate: 0.2}}
  - {name: truncation, label: truncate_25words, config: {keep_fraction: null, max_words: 25}}
evaluation:
  target_fprs: [0.01, 0.05]
  primary_fpr: 0.05
  perplexity: true
  oracle_model: gpt2-medium
