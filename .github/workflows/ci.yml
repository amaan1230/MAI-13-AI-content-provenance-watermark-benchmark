name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install ruff
      - run: ruff check backend tests frontend scripts
      - run: ruff format --check backend tests frontend scripts

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mai13
          POSTGRES_PASSWORD: mai13
          POSTGRES_DB: mai13_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mai13" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3"
          pip install -r requirements-dev.txt
      - name: Unit + integration tests (SQLite)
        run: pytest -q --cov=backend --cov-report=term --junitxml=test-results-sqlite.xml
      - name: Full suite against PostgreSQL (migrations, JSONB, advisory locks)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://mai13:mai13@localhost:5432/mai13_test
          TEST_POSTGRES_URL: postgresql+psycopg://mai13:mai13@localhost:5432/mai13_test
        run: pytest -q -p no:cacheprovider --junitxml=test-results-postgres.xml
      - name: Validate shipped experiment configs
        run: python -m backend.experiments.cli validate experiments/configs/*.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results-*.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pip-audit
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Secret scan (no keys committed)
        run: |
          ! grep -rEn "AIza[0-9A-Za-z_-]{35}|hf_[0-9A-Za-z]{30,}" --include='*.py' --include='*.yml' --include='*.yaml' \
            --include='*.md' --include='*.example' --include='*.toml' .

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mai13:ci .
